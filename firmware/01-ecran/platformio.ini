; Test d'affichage : deux variantes de contrôleur d'écran, à essayer l'une après l'autre.
; Choisir l'environnement dans la barre du bas de VS Code (« Default » -> ili9341 ou st7789).

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000

[env:ili9341]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1

[env:st7789]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
